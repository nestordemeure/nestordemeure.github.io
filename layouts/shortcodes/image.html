{{- /* overrides the theme's image shortcode to lazy-load images */ -}}
{{ if .Get "src" }}
    <img src="{{ .Get "src" | safeURL }}" loading="lazy" decoding="async" {{ with .Get "alt" }} alt="{{ . | plainify }}" {{ end }} class="{{ with .Get "position"}}{{ . }}{{ else -}} left {{- end }}" {{ with .Get "style" }} style="{{ . | safeCSS }}" {{ end }} />
{{ end }}
