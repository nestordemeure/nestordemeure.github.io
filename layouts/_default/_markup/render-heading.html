{{- /* NOTE: static/js/show_current_month.js relies on this `heading-wrapper` div to find and toggle month sections */ -}}
<div class="heading-wrapper">
    <h{{ .Level }} id="{{ .Anchor | safeURL }}">
        <a class="heading-anchor" href="#{{ .Anchor | safeURL }}" style="text-decoration: none">
            {{ .Text | safeHTML }}
        </a>
    </h{{ .Level }}>
</div>
